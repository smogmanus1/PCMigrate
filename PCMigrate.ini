; ==============================================================================
; PCMigrate.ini - your settings. Lines starting with ; are comments.
; %ENVIRONMENT% variables are expanded. Wildcards (*) are allowed in lists.
; Hardware/compatibility knowledge lives in rules\compat-rules.json.
; ==============================================================================

[Paths]
; Where packages are created (old PC) and looked for (new PC).
; Blank = the folder that contains this PCMigrate folder. Putting PCMigrate in a
; synced folder (e.g. Dropbox\Migration\PCMigrate) makes packages appear on the
; new PC automatically.
PackageRoot=
; Blank = rules\compat-rules.json
RulesFile=

[Capture]
; 1 = also export saved Wi-Fi networks WITH their passwords in plain text.
IncludeWifi=0
; 1 = also copy your .ssh folder (private keys!). Keep the package private.
IncludeSsh=0

[Restore]
; Create a Windows System Restore point before changing anything.
CreateRestorePoint=1

[Retired]
; Apps you do NOT want carried to any new PC - never installed, settings never
; restored. Matched against app names, winget IDs and settings folder names.
; Examples:
; Bitdefender*
; RemotePC*

[ManualIgnore]
; Left off the "install by hand" list entirely: runtimes, SDKs and Windows parts
; that installers bring along on their own.
Microsoft Visual C++*
*Redistributable*
Microsoft .NET*
Microsoft Windows Desktop Runtime*
Microsoft ASP.NET*
Windows Software Development Kit*
Windows SDK*
Microsoft Update Health Tools
Microsoft GameInput*
Microsoft Teams*
Microsoft OneDrive*

[RoamingExclude]
; Folders under %APPDATA% that are never copied. The Microsoft ones are tied to
; this PC's encryption keys and break on another PC.
Microsoft\Protect
Microsoft\Crypto
Microsoft\Credentials
Microsoft\SystemCertificates
Microsoft\Vault
Microsoft\Windows
Microsoft\Teams
Dropbox

[SkipFolderNames]
; Folder names skipped anywhere inside copied settings - caches rebuild themselves.
Cache
Code Cache
GPUCache
CachedData
Crashpad
Service Worker
blob_storage
Temp
logs

[LocalAppData]
; Extra folders under %LOCALAPPDATA% to capture. Most apps keep settings in
; Roaming (captured automatically); add the ones that keep them here. Examples:
; Programs\SomeApp
; SomeVendor\SomeApp

[RegistrySkip]
; Top-level keys under HKCU\Software that are not exported.
Microsoft
Classes
Policies
Wow6432Node
Clients
RegisteredApplications
AppDataLow

[TaskSkip]
; Scheduled tasks not captured or offered (matched against the name and the
; full \folder\name). App updaters, telemetry and Windows' own tasks recreate themselves.
*Update*
*Updater*
*Telemetry*
*CrashReport*
OneDrive*
MicrosoftEdge*
GoogleUpdate*
GoogleSystem*
Adobe*
CCleaner*
Nv*
Intel*
AMD*
Dropbox*
Opera*
Brave*
npcapwatchdog
\SoftLanding\*
\GoogleUserPEH\*
\HP\*
CreateExplorerShellUnelevatedTask
Microsoft_*
StartCN*
StartDVR*
*Default Browser Agent*
HPCustParticipation*
Autorun for *

[StartupSkip]
; Startup entries never offered (updaters re-add themselves when the app installs).
*Update*
*Updater*
Bonus.SSR.*
